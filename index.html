    if (!State.activities.length) return '<div class="t-sm t-muted" style="padding:8px 0">Sin actividades agregadas.</div>';
    var icons = { deporte:'⚽', trabajo:'💼', familia:'🏠', amigos:'👥', traslado:'🚌', preuniversitario:'📘', otro:'•' };
    var h = '<div class="item-list">';
    State.activities.forEach(function(a) {
      var meta = (a.days||[]).join(', ');
      if (a.start && a.end) meta += ' &middot; ' + a.start + '&ndash;' + a.end;
      else meta += ' &middot; <span class="t-dim">sin hora · no bloquea tiempo automáticamente</span>';
      h += '<div class="item-row"><div style="flex-shrink:0;font-size:15px;">' + (icons[a.type]||'•') + '</div><div class="item-body"><div class="item-title">' + Utils.esc(a.name) + '</div><div class="item-meta">' + meta + '</div></div><div class="item-actions"><button class="btn-del" onclick="OB._s3del(\'' + a.id + '\')">&#x2715;</button></div></div>';
    });
    return h + '</div>';
  },

  _s3del: function(id) {
    State.activities = State.activities.filter(function(a){ return a.id !== id; });
    Persist.save();
    OB._s3refresh();
  },

  // ── Step 4: Exams ────────────────────────────
  step4: function(body) {
    var ev = Utils.vocab('eval');
    var h = '<div class="step-title">Evaluaciones</div>';
    h += '<div class="step-subtitle">Agrega tus ' + Utils.vocab('eval') + 's con temario. EstudIA asignará sesiones específicas de estudio.</div>';
    h += '<button class="btn-primary btn-sm" onclick="OB._openExamModal()" style="margin-bottom:14px;">+ Agregar ' + ev + '</button>';
    h += '<div id="s4-list">' + OB._examList() + '</div>';
    body.innerHTML = h;
  },

  _examList: function() {
    if (!State.exams.length) return '<div class="t-sm t-muted">Sin evaluaciones agregadas.</div>';
    var h = '<div class="item-list">';
    State.exams.forEach(function(ex) {
      var dl = Utils.daysUntil(ex.date);
      var dlStr = dl >= 0 ? dl + ' día(s)' : 'ya pasó';
      h += '<div class="item-row" style="border-left-color:' + Utils.color(ex.subject) + '"><div class="item-body"><div class="item-title">' + Utils.esc(ex.subject) + (ex.important ? ' <span style="color:var(--amber)">★</span>' : '') + '</div><div class="item-meta">' + Utils.humanDate(ex.date) + ' &middot; ' + dlStr + ' &middot; ' + (ex.difficulty||'media') + (ex.topics && ex.topics.length ? ' &middot; ' + ex.topics.length + ' temas' : '') + '</div></div><div class="item-actions"><button class="btn-edit" onclick="OB._openExamModal(\'' + ex.id + '\')">Editar</button><button class="btn-del" onclick="OB._delExam(\'' + ex.id + '\')">&#x2715;</button></div></div>';
    });
    return h + '</div>';
  },

  _openExamModal: function(id) {
    var ex = id ? State.exams.find(function(e){ return e.id === id; }) : null;
    State.editExamId = id || null;
    var draft = ex ? JSON.parse(JSON.stringify(ex)) : { id: Utils.id(), subject:'', date:'', difficulty:'media', important:false, dominio:'voy mas o menos', topics:[] };
    OB._examDraft = draft;

    var ev = Utils.vocab('eval');
    var h = '<div class="two-col"><div class="fg-group"><label>' + Utils.cap(Utils.vocab('cosa')) + '</label><input id="ex-subj" value="' + Utils.esc(draft.subject) + '" placeholder="Cálculo, Historia…"></div><div class="fg-group"><label>Fecha</label><input type="date" id="ex-date" value="' + (draft.date||'') + '"></div></div>';

    h += '<div class="fg-group"><label>Dificultad</label><div class="pill-group">';
    ['facil','media','dificil'].forEach(function(d) {
      var lbl = {facil:'Fácil',media:'Media',dificil:'Difícil'}[d];
      var on = (draft.difficulty === d || (draft.difficulty==='fácil'&&d==='facil') || (draft.difficulty==='difícil'&&d==='dificil')) ? ' on' : '';
      h += '<div class="pill' + on + '" onclick="OB._exPill(this);" data-diff="' + d + '">' + lbl + '</div>';
    });
    h += '</div></div>';

    h += '<div class="fg-group"><label>¿Cómo vas con la materia?</label><div class="pill-group" style="flex-direction:column;align-items:stretch;">';
    ['no entiendo nada','voy mas o menos','ya casi lo manejo'].forEach(function(d) {
      var on = draft.dominio === d ? ' on' : '';
      h += '<div class="pill' + on + '" style="text-align:center;" onclick="OB._exDom(this);" data-dom="' + d + '">' + Utils.cap(d) + '</div>';
    });
    h += '</div></div>';

    h += '<div class="fg-group"><label style="display:flex;align-items:center;gap:7px;cursor:pointer;"><input type="checkbox" id="ex-imp"' + (draft.important?' checked':'') + ' style="width:auto;"> Es importante / prioritaria</label></div>';

    h += '<div style="height:1px;background:var(--border);margin:14px 0;"></div>';

    h += '<div class="fg-group"><label>Temario (pega aquí tus temas o contenidos)</label><textarea id="ex-topics" style="min-height:90px;" placeholder="Pega tu temario aquí: uno por línea, o separado por comas o punto y coma.">' + (draft.topics||[]).join('\n') + '</textarea></div>';

    h += '<div id="ex-topics-preview">';
    if (draft.topics && draft.topics.length) {
      h += OB._topicsPreview(draft.topics);
    }
    h += '</div>';

    h += '<button class="btn-secondary btn-sm mt-4" onclick="OB._exExtractTopics()">Extraer temas del texto</button>';

    h += '<div style="display:flex;gap:8px;margin-top:18px;"><button class="btn-primary" onclick="OB._saveExam()">Guardar</button><button class="btn-secondary" onclick="UI.closeModal()">Cancelar</button></div>';

    UI.modal(Utils.cap(ev), h);
  },

  _topicsPreview: function(topics) {
    if (!topics || !topics.length) return '';
    var h = '<div class="banner bn-green mt-8"><div class="banner-icon">ok</div><div class="banner-body"><div class="banner-title">' + topics.length + ' tema(s) detectado(s)</div></div></div>';
    h += '<ul class="topic-list mt-8">';
    topics.forEach(function(t, i) {
      h += '<li class="topic-item"><div class="topic-n">' + (i+1) + '</div><div>' + Utils.esc(t) + '</div></li>';
    });
    h += '</ul>';
    return h;
  },

  _exPill: function(el) {
    var group = el.closest('.pill-group');
    if (group) group.querySelectorAll('[data-diff]').forEach(function(p){ p.classList.remove('on'); });
    el.classList.add('on');
    if (OB._examDraft) OB._examDraft.difficulty = el.dataset.diff;
  },

  _exDom: function(el) {
    var group = el.closest('.pill-group');
    if (group) group.querySelectorAll('[data-dom]').forEach(function(p){ p.classList.remove('on'); });
    el.classList.add('on');
    if (OB._examDraft) OB._examDraft.dominio = el.dataset.dom;
  },

  _exExtractTopics: function() {
    var raw = (document.getElementById('ex-topics') || {}).value || '';
    var topics = Parse.topics(raw);
    var prev = document.getElementById('ex-topics-preview');
    if (!topics.length) {
      if (prev) prev.innerHTML = '<div class="banner bn-yellow mt-8"><div class="banner-icon">!</div><div class="banner-body"><div class="banner-title">No detecté temas con formato claro</div><div class="banner-desc">Prueba con un tema por línea, o separados por comas.</div></div></div>';
      return;
    }
    if (OB._examDraft) OB._examDraft.topics = topics;
    if (prev) prev.innerHTML = OB._topicsPreview(topics);
  },

  _saveExam: function() {
    var subj = (document.getElementById('ex-subj') || {}).value || '';
    var date = (document.getElementById('ex-date') || {}).value || '';
    var imp  = !!(document.getElementById('ex-imp') || {}).checked;
    var raw  = (document.getElementById('ex-topics') || {}).value || '';
    subj = subj.trim();
    if (!subj) { UI.toast('Ingresa el nombre del ' + Utils.vocab('cosa'), 'err'); return; }
    if (!date) { UI.toast('Ingresa la fecha', 'err'); return; }

    var draft = OB._examDraft || {};
    draft.subject   = subj;
    draft.date      = date;
    draft.important = imp;
    if (!draft.difficulty) draft.difficulty = 'media';
    if (!draft.dominio)    draft.dominio    = 'voy mas o menos';
    if (!draft.topics || !draft.topics.length) {
      draft.topics = Parse.topics(raw);
    }

    if (State.editExamId) {
      var idx = State.exams.findIndex(function(e){ return e.id === State.editExamId; });
      if (idx >= 0) State.exams[idx] = draft;
    } else {
      State.exams.push(draft);
    }

    State.editExamId = null;
    Persist.save();
    UI.closeModal();
    var el = document.getElementById('s4-list');
    if (el) el.innerHTML = OB._examList();
    UI.toast('Guardado', 'ok');
  },

  _delExam: function(id) {
    State.exams = State.exams.filter(function(e){ return e.id !== id; });
    Persist.save();
    var el = document.getElementById('s4-list');
    if (el) el.innerHTML = OB._examList();
  },

  // ── Step 5: Preferences + Confirmation ───────
  step5: function(body) {
    var wakeDisp = Utils.time(State.prefs.wake || '07:00') || '07:00';
    var sleepDisp = Utils.time(State.prefs.sleep || '23:00') || '23:00';
    var h = '<div class="step-title">Preferencias y confirmación</div>';
    h += '<div class="step-subtitle">Ajusta cómo quieres estudiar y revisa todo antes de generar.</div>';

    h += '<div class="card"><div style="font-family:var(--font-d);font-size:16px;font-weight:600;margin-bottom:14px;letter-spacing:-0.01em;">Cómo prefieres estudiar</div>';

    h += '<div class="fg-group"><label>Horario preferido</label><div class="pill-group">';
    [['morning','Mañana'],['day','Tarde'],['night','Noche']].forEach(function(p) {
      var on = (State.prefs.when === p[0] || (!State.prefs.when && p[0]==='day')) ? ' on' : '';
      h += '<div class="pill' + on + '" data-when="' + p[0] + '" onclick="UI.togglePill(this)">' + p[1] + '</div>';
    });
    h += '</div></div>';

    h += '<div class="fg-group"><label>Duración del bloque</label><div class="pill-group">';
    [[30,'30 min'],[45,'45 min'],[60,'1 hora'],[90,'1.5 h']].forEach(function(p) {
      var on = State.prefs.block == p[0] ? ' on' : '';
      h += '<div class="pill' + on + '" data-block="' + p[0] + '" onclick="UI.togglePill(this)">' + p[1] + '</div>';
    });
    h += '</div></div>';

    h += '<div class="fg-group"><label>Máximo de horas de estudio por día</label><div class="pill-group">';
    [2,3,4,5].forEach(function(n) {
      var on = State.prefs.maxH == n ? ' on' : '';
      h += '<div class="pill' + on + '" data-maxh="' + n + '" onclick="UI.togglePill(this)">' + n + 'h</div>';
    });
    h += '</div></div>';

    h += '<div class="two-col"><div class="fg-group"><label>Hora de levantarse</label><input id="pref-wake" class="input-time" type="text" inputmode="numeric" autocomplete="off" value="' + wakeDisp + '" placeholder="HH:MM (ej. 07:00)" oninput="OB._updateSleep()" onblur="UI.blurTime(this);OB._updateSleep();"></div><div class="fg-group"><label>Hora de acostarse</label><input id="pref-sleep" class="input-time" type="text" inputmode="numeric" autocomplete="off" value="' + sleepDisp + '" placeholder="HH:MM (ej. 23:00)" oninput="OB._updateSleep()" onblur="UI.blurTime(this);OB._updateSleep();"></div></div>';
    h += '<div style="text-align:center;padding:6px 0;"><div class="t-sm t-muted">Horas de sueño estimadas</div><div class="sleep-num" id="sleep-display">-</div><div class="t-sm" id="sleep-note" style="margin-top:3px;"></div></div>';
    h += '</div>';

    h += '<div class="card mt-16"><div style="font-family:var(--font-d);font-size:16px;font-weight:600;margin-bottom:4px;letter-spacing:-0.01em;">Energía por día</div>';
    h += '<div class="t-xs t-dim mt-4" style="margin-bottom:4px;">Los días de baja energía acortan un poco el bloque de estudio; los de alta energía lo estiran.</div>';
    h += '<div class="energy-grid">';
    DAYS.forEach(function(d) {
      var cur = (State.prefs.energy && State.prefs.energy[d]) || 'normal';
      h += '<div class="energy-row"><div class="energy-label">' + d + '</div><div class="energy-opts">';
      [['low','el','Baja'],['normal','en','Normal'],['high','eh','Alta']].forEach(function(o) {
        var on = cur === o[0] ? ' on' : '';
        h += '<button type="button" class="energy-btn ' + o[1] + on + '" onclick="OB._setEnergy(\'' + d + '\',\'' + o[0] + '\',this)">' + o[2] + '</button>';
      });
      h += '</div></div>';
    });
    h += '</div></div>';

    h += '<div style="margin-top:20px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Revisa antes de generar</div>';

    h += '<div class="conf-block"><div class="conf-head"><div class="conf-label">Perfil</div></div>';
    h += '<div class="conf-row">' + Utils.esc(State.profile.name) + ' &mdash; ' + State.profile.level + ' (' + State.profile.sub + ')</div></div>';

    h += '<div class="conf-block"><div class="conf-head"><div class="conf-label">Horario (' + State.schedule.length + ' clases)</div><button class="btn-ghost btn-sm" onclick="OB.goTo(2)">Editar</button></div>';
    if (State.schedule.length) {
      State.schedule.forEach(function(c) { h += '<div class="conf-row">' + Utils.esc(c.name) + ' &mdash; ' + c.days.join(', ') + ' ' + c.start + '&ndash;' + c.end + '</div>'; });
    } else {
      h += '<div class="conf-row t-muted">Sin clases</div>';
    }
    h += '</div>';

    h += '<div class="conf-block"><div class="conf-head"><div class="conf-label">Actividades (' + State.activities.length + ')</div><button class="btn-ghost btn-sm" onclick="OB.goTo(3)">Editar</button></div>';
    if (State.activities.length) {
      State.activities.forEach(function(a){ h += '<div class="conf-row">' + Utils.esc(a.name) + ' &mdash; ' + (a.days||[]).join(', ') + '</div>'; });
    } else {
      h += '<div class="conf-row t-muted">Sin actividades</div>';
    }
    if (State.commute.minutes > 0) h += '<div class="conf-row">Traslado: ' + State.commute.minutes + ' min &mdash; ' + State.commute.days.join(', ') + '</div>';
    h += '</div>';

    h += '<div class="conf-block"><div class="conf-head"><div class="conf-label">Evaluaciones (' + State.exams.length + ')</div><button class="btn-ghost btn-sm" onclick="OB.goTo(4)">Editar</button></div>';
    State.exams.forEach(function(ex) {
      h += '<div class="conf-row">' + Utils.esc(ex.subject) + ' &mdash; ' + Utils.humanDate(ex.date) + (ex.topics&&ex.topics.length?' &middot; '+ex.topics.length+' temas':'') + '</div>';
    });
    h += '</div>';

    h += '<div class="banner bn-blue mt-8"><div class="banner-icon">*</div><div class="banner-body"><div class="banner-title">Listo para generar</div><div class="banner-desc">EstudIA creará sesiones con un tema, horario y duración concretos para cada día.</div></div></div>';

    body.innerHTML = h;
    OB._updateSleep();
  },

  _setEnergy: function(day, level, btn) {
    if (!State.prefs.energy) State.prefs.energy = {};
    State.prefs.energy[day] = level;
    var row = btn.closest('.energy-opts');
    if (row) row.querySelectorAll('.energy-btn').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
  },

  _updateSleep: function() {
    var wk = (document.getElementById('pref-wake')  || {}).value || '07:00';
    var sl = (document.getElementById('pref-sleep') || {}).value || '23:00';
    var wm = Utils.toMins(Utils.time(wk) || '07:00');
    var sm = Utils.toMins(Utils.time(sl) || '23:00');
    if (sm <= wm) sm += 1440;
    var hrs = (wm + 1440 - sm) / 60;
    var disp = document.getElementById('sleep-display');
    var note = document.getElementById('sleep-note');
    if (disp) {
      disp.textContent = hrs.toFixed(1) + 'h';
      disp.className = 'sleep-num ' + (hrs >= 7 ? 'sleep-good' : hrs >= 6 ? 'sleep-warn' : 'sleep-bad');
    }
    if (note) {
      note.innerHTML = hrs < 6
        ? '<span style="color:var(--coral)">Estás durmiendo muy poco. El plan se ajustará.</span>'
        : hrs < 7
        ? '<span style="color:var(--amber)">Sueño algo justo.</span>'
        : '<span style="color:var(--green)">Buen descanso.</span>';
    }
  }
};

// ============================================================
// MODULE: Views  — dashboard rendering
// ============================================================
var Views = {
  today: function() {
    var today = Utils.today();
    var dp = State.plan.find(function(d){ return d.date === today; });
    var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    var tomorrowStr = tomorrow.toISOString().split('T')[0];
    var tp = State.plan.find(function(d){ return d.date === tomorrowStr; });
    var nextExam = null;
    State.exams.forEach(function(ex) {
      var dl = Utils.daysUntil(ex.date);
      if (dl >= 0 && (!nextExam || new Date(ex.date) < new Date(nextExam.date))) nextExam = ex;
    });

    var done  = dp ? dp.sessions.filter(function(s){ return s.done; }).length : 0;
    var total = dp ? dp.sessions.length : 0;
    var streak = Analytics.streak();

    var h = '<div class="today-hero">';
    h += '<div class="today-hero-l">';
    h += '<div class="today-dateline">' + Utils.humanDate(today) + '</div>';
    h += '<div class="today-greeting">Hola, ' + Utils.esc(State.profile.name) + '</div>';
    h += '<div class="today-sub">';
    if (total) {
      h += total + ' sesión(es) hoy — ' + done + ' completada(s).';
    } else {
      h += 'No hay sesiones programadas para hoy.';
    }
    if (nextExam) {
      var dl = Utils.daysUntil(nextExam.date);
      h += ' &nbsp;<strong>' + Utils.esc(nextExam.subject) + '</strong> en ' + dl + ' día(s).';
    }
    h += '</div>';
    if (streak > 0) h += '<div class="streak-chip">🔥 ' + streak + ' día(s) seguidos estudiando</div>';
    h += '</div>';
    if (total) {
      h += UI.ring(total ? Math.round(done/total*100) : 0, { size: 78, stroke: 7, color: 'var(--amber)', label: 'Hoy' });
    } else if (nextExam) {
      var dln = Utils.daysUntil(nextExam.date);
      h += UI.ring(0, { size: 78, stroke: 7, color: 'var(--teal)', track: 'var(--surface-3)',
        centerHtml: '<div class="ring-pct" style="font-size:20px;">' + dln + '</div><div class="ring-label">día(s)</div>' });
    }
    h += '</div>';

    if (dp && dp.alerts && dp.alerts.length) {
      h += '<div style="margin-bottom:12px;">';
      dp.alerts.forEach(function(a) { h += '<span class="alert-tag at-' + a.kind + '">' + Utils.esc(a.msg) + '</span>'; });
      h += '</div>';
    }

    if (dp && dp.sessions && dp.sessions.length) {
      h += '<div class="sec-head"><div class="sec-title">Qué me toca hoy</div></div>';
      var list = dp.sessions.slice().sort(function(a,b){ return Utils.toMins(a.start) - Utils.toMins(b.start); });
      var nextIdx = list.findIndex(function(s){ return !s.done; });
      list.forEach(function(s, i) {
        h += Views._sessionCard(s, today, { order: i, nextIdx: nextIdx });
      });
    } else {
      h += '<div class="card empty-card">';
      h += '<div class="empty-emoji">📅</div>';
      h += '<div class="empty-title">Sin sesiones para hoy</div>';
      h += '<div class="t-sm t-muted">No hay tiempo libre disponible hoy o no hay evaluaciones próximas.</div>';
      h += '</div>';
    }

    if (tp && tp.sessions && tp.sessions.length) {
      h += '<div class="sec-head mt-24"><div class="sec-title">Mañana</div></div>';
      var listM = tp.sessions.slice().sort(function(a,b){ return Utils.toMins(a.start) - Utils.toMins(b.start); });
      var nextIdxM = listM.findIndex(function(s){ return !s.done; });
      listM.forEach(function(s, i) {
        h += Views._sessionCard(s, tomorrowStr, { order: i, nextIdx: nextIdxM, isTomorrow: true });
      });
    }

    return h;
  },

  _sessionCard: function(s, dateStr, meta) {
    meta = meta || {};
    var types = { 'aprender tema':'Aprender', 'practicar':'Practicar', 'repasar':'Repasar', 'repaso final':'Repaso final' };
    var doneClass = s.done ? ' done' : '';
    var btnClass  = s.done ? ' on' : '';
    var topicShow = Utils.displayTopic(s.topic, s.subject);
    var isNext = !s.done && meta.nextIdx === meta.order;
    var roleClass = isNext ? ' sc-next' : '';
    var stLabel = s.done ? '<span class="sc-status st-done">Hecha</span>'
      : (isNext ? '<span class="sc-status st-next">' + (meta.isTomorrow ? 'Primero' : 'Siguiente') + '</span>'
      : '<span class="sc-status st-later">Después</span>');
    var ex = State.exams.find(function(e){ return e.id === s.examId; });
    var dl = ex ? Utils.daysUntil(ex.date) : 999;
    var prio = (!s.done && dl >= 0 && dl <= 3)
      ? '<span class="sc-prio">' + (dl === 0 ? 'Hoy evalúas' : (dl + ' d')) + '</span>'
      : '';
    var topicCls = isNext ? ' sc-topic-em' : '';
    return '<div class="session-card' + doneClass + roleClass + '" id="sc-' + s.id + '" style="border-left-color:' + s.color + '">' +
      '<div class="sc-time"><div class="sc-time-main">' + s.start + '</div><div class="sc-dur">' + s.dur + ' min</div></div>' +
      '<div class="sc-body"><div class="sc-rowtop"><div class="sc-subj" style="color:' + s.color + '">' + Utils.esc(s.subject) + '</div>' + prio + stLabel + '</div>' +
      '<div class="sc-topic' + topicCls + '">' + Utils.esc(topicShow) + '</div>' +
      '<div class="sc-type">' + (types[s.type] || s.type) + '</div></div>' +
      '<div class="sc-actions"><button type="button" class="done-btn' + btnClass + '" onclick="Views._toggleDone(\'' + s.id + '\',\'' + dateStr + '\')" title="Marcar como hecha">&#x2713;</button></div>' +
      '</div>';
  },

  _toggleDone: function(sid, dateStr) {
    var dp = State.plan.find(function(d){ return d.date === dateStr; });
    if (!dp) return;
    var s = dp.sessions.find(function(s){ return s.id === sid; });
    if (!s) return;
    s.done = !s.done;
    Persist.save();
    if (State.view === 'today' && dateStr === Utils.today()) {
      App.showView('today');
      return;
    }
    if (State.view === 'week') { App.showView('week'); return; }
    var card = document.getElementById('sc-' + sid);
    if (card) {
      if (s.done) card.classList.add('done'); else card.classList.remove('done');
      var btn = card.querySelector('.done-btn');
      if (btn) { if (s.done) btn.classList.add('on'); else btn.classList.remove('on'); }
    }
  },

  week: function() {
    var today = new Date(); today.setHours(0,0,0,0);
    var dow = today.getDay();
    var mon = new Date(today); mon.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
    var days = [];
    for (var i = 0; i < 7; i++) { var d = new Date(mon); d.setDate(mon.getDate() + i); days.push(d); }
    var dateList = days.map(function(d){ return d.toISOString().split('T')[0]; });

    var h = '<div class="sec-head sec-head-actions"><div class="sec-title">Esta semana</div><button type="button" class="btn-secondary btn-sm" onclick="Views._replan()">Replanificar</button></div>';
    h += '<div class="card"><div class="t-xs t-muted" style="margin-bottom:2px;">Minutos estudiados por día</div>' + UI.miniChart(dateList) + '</div>';

    h += '<div class="week-scroll mt-16"><div class="week-grid">';
    days.forEach(function(d) {
      var ds    = d.toISOString().split('T')[0];
      var dayS  = DAYS[d.getDay() === 0 ? 6 : d.getDay() - 1];
      var isTod = d.getTime() === today.getTime();
      var dp    = State.plan.find(function(p){ return p.date === ds; });
      var exs   = State.exams.filter(function(ex){ return ex.date === ds; });
      h += '<div class="week-col' + (isTod ? ' is-today' : '') + '">';
      h += '<div class="week-col-head"><div class="week-col-name">' + dayS + '</div><div class="week-col-num">' + d.getDate() + '</div></div>';
      exs.forEach(function(ex){ h += '<div class="wk-exam">📝 ' + Utils.esc(ex.subject) + '</div>'; });
      if (dp) dp.sessions.forEach(function(s) {
        h += '<div class="wk-chip" style="background:' + s.color + '22;color:' + s.color + ';border:1px solid ' + s.color + '44;' + (s.done ? 'opacity:.55;text-decoration:line-through;' : '') + '" title="' + Utils.esc(Utils.displayTopic(s.topic, s.subject)) + '">' + s.start + ' ' + Utils.esc(s.subject) + '</div>';
      });
      h += '</div>';
    });
    h += '</div></div>';

    var stats = Analytics.rangeStats(dateList);
    var ne = null;
    State.exams.forEach(function(ex) {
      var dl = Utils.daysUntil(ex.date);
      if (dl >= 0 && (!ne || new Date(ex.date) < new Date(ne.date))) ne = ex;
    });
    h += '<div class="stat-grid">';
    h += '<div class="stat-card"><div class="stat-lbl">Sesiones completadas</div><div class="stat-val">' + stats.doneS + '</div><div class="stat-sub">' + (stats.totalS ? 'de ' + stats.totalS + ' planificadas esta semana' : 'sin sesiones planificadas esta semana') + '</div></div>';
    h += '<div class="stat-card"><div class="stat-lbl">Horas estudiadas</div><div class="stat-val">' + (stats.minutes/60).toFixed(1) + 'h</div><div class="stat-sub">solo sesiones marcadas como hechas</div></div>';
    h += '<div class="stat-card"><div class="stat-lbl">Próxima evaluación</div><div class="stat-val" style="font-size:15px;">' + (ne ? Utils.esc(ne.subject) : '—') + '</div><div class="stat-sub">' + (ne ? 'en ' + Utils.daysUntil(ne.date) + ' día(s)' : 'no hay evaluaciones pendientes') + '</div></div>';
    h += '</div>';

    return h;
  },

  _replan: function() {
    if (!confirm('¿Replanificar la semana? Se mantendrá el progreso marcado como hecho.')) return;
    var today = new Date(); today.setHours(0,0,0,0);
    for (var i = 0; i < 7; i++) {
      var d = new Date(today); d.setDate(today.getDate() + i);
      var ds = d.toISOString().split('T')[0];
      State.plan = State.plan.filter(function(p){ return p.date !== ds; });
    }
    Planner.generate();
    Persist.save();
    App.showView('week');
    UI.toast('Semana replanificada', 'ok');
  },

  progress: function() {
    var h = '<div class="sec-head"><div class="sec-title">Mi avance</div></div>';
    if (!State.exams.length) return h + '<div class="card empty-card">Sin evaluaciones cargadas.</div>';

    var overall = Analytics.overallTopics();
    var streak = Analytics.streak();
    var totalMin = Analytics.totalMinutesStudied();

    h += '<div class="overview-grid">';
    h += '<div class="overview-card">' + UI.ring(overall.pct, { size: 64, stroke: 6, color: 'var(--amber)' }) +
      '<div><div class="overview-txt-lbl">Avance general</div><div class="overview-txt-val">' + overall.pct + '%</div><div class="overview-txt-sub">' + overall.done + ' de ' + overall.total + ' temas</div></div></div>';
    h += '<div class="overview-card"><div class="ring-wrap" style="width:64px;height:64px;font-size:28px;">🔥</div>' +
      '<div><div class="overview-txt-lbl">Racha</div><div class="overview-txt-val">' + streak + '</div><div class="overview-txt-sub">día(s) seguidos</div></div></div>';
    h += '<div class="overview-card"><div class="ring-wrap" style="width:64px;height:64px;font-size:28px;">⏱️</div>' +
      '<div><div class="overview-txt-lbl">Tiempo total</div><div class="overview-txt-val">' + (totalMin/60).toFixed(1) + 'h</div><div class="overview-txt-sub">estudiadas en total</div></div></div>';
    h += '</div>';

    h += '<div class="card mt-8"><div class="t-xs t-muted" style="margin-bottom:2px;">Minutos estudiados — últimos 14 días</div>' + UI.miniChart(Analytics.lastNDays(14), function(d){ return d.getDate(); }) + '</div>';

    h += '<div class="sec-head mt-24"><div class="sec-title">Por ' + Utils.vocab('eval') + '</div></div>';

    State.exams.forEach(function(ex) {
      var sessions = [];
      State.plan.forEach(function(d){ d.sessions.forEach(function(s){ if (s.examId === ex.id) sessions.push(s); }); });
      var doneSess  = sessions.filter(function(s){ return s.done; }).length;
      var totalSess = sessions.length;
      var dl    = Utils.daysUntil(ex.date);
      var color = Utils.color(ex.subject);
      var topics = ex.topics && ex.topics.length;
      var topicsDone = 0;
      if (topics) {
        ex.topics.forEach(function(t) {
          var kt = Utils.sanitizeTopic(t, ex.subject) || t;
          if (sessions.some(function(s){
            if (!s.done) return false;
            var ks = Utils.sanitizeTopic(s.topic, ex.subject) || s.topic;
            return ks === kt || s.topic === t;
          })) topicsDone++;
        });
      }
      var pct = topics
        ? Math.round(topicsDone / ex.topics.length * 100)
        : (totalSess ? Math.round(doneSess / totalSess * 100) : 0);
      var diffLbl = ex.difficulty === 'facil' ? 'Fácil' : ex.difficulty === 'dificil' ? 'Difícil' : 'Media';

      h += '<div class="prog-exam-card">';
      h += '<div class="pec-head">' + UI.ring(pct, { size: 58, stroke: 5, color: color }) +
        '<div><div class="pec-name" style="color:' + color + '">' + Utils.esc(ex.subject) + (ex.important?' <span style="color:var(--amber)">★</span>':'') + '</div><div class="pec-meta">' + Utils.humanDate(ex.date) + (dl >= 0 ? ' &middot; ' + dl + ' día(s)' : ' &middot; ya pasó') + '</div></div></div>';
      h += '<div class="pec-stats"><span>' + (topics ? (topicsDone + '/' + ex.topics.length + ' temas con sesión hecha') : (doneSess + '/' + totalSess + ' sesiones del plan hechas')) + '</span><span>' + diffLbl + '</span></div>';

      if (ex.topics && ex.topics.length) {
        h += '<div class="t-xs t-dim" style="margin:12px 0 4px 0;">La marca verde indica que completaste al menos una sesión dedicada a ese tema.</div>';
        h += '<div>';
        ex.topics.forEach(function(t) {
          var kt = Utils.sanitizeTopic(t, ex.subject) || t;
          var tdone = sessions.some(function(s){
            if (!s.done) return false;
            var ks = Utils.sanitizeTopic(s.topic, ex.subject) || s.topic;
            return ks === kt || s.topic === t;
          });
          h += '<div class="topic-row"><div class="topic-dot' + (tdone?' done':'') + '">' + (tdone?'&#x2713;':'') + '</div><div class="t-sm' + (tdone?'':' t-muted') + '">' + Utils.esc(t) + '</div></div>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
    return h;
  },

  summaries: function() {
    var h = '<div class="sec-head"><div class="sec-title">Resúmenes y temas</div></div>';
    var shown = 0;
    State.exams.forEach(function(ex) {
      if (!ex.topics || !ex.topics.length) return;
      shown++;
      var color = Utils.color(ex.subject);
      h += '<div class="summary-card"><div class="summary-subject" style="color:' + color + '">' + Utils.esc(ex.subject) + '</div>';
      h += '<ul class="topic-list">';
      ex.topics.forEach(function(t, i) {
        var ts = Utils.sanitizeTopic(t, ex.subject) || Utils.displayTopic(t, ex.subject);
        h += '<li class="topic-item"><div class="topic-n">' + (i+1) + '</div><div>' + Utils.esc(ts) + '</div></li>';
      });
      h += '</ul></div>';
    });
    if (!shown) h += '<div class="card empty-card">Sin resúmenes. Agrega temario en el paso de evaluaciones.</div>';
    return h;
  }
};

// ============================================================
// MODULE: App  —  top-level controller
// ============================================================
var App = {
  init: function() {
    var ok = Persist.load();
    if (ok && State.ready && State.profile.name && State.exams.length) {
      App.showDash();
    } else {
      State.step = 1;
      State.ready = false;
      document.getElementById('ob-shell').style.display = '';
      document.getElementById('dash-shell').classList.remove('on');
      OB.render();
    }
    if (window.innerWidth < 600) {
      var mb = document.getElementById('menuToggle');
      if (mb) mb.style.display = 'flex';
    }
  },

  showDash: function() {
    document.getElementById('ob-shell').style.display = 'none';
    document.getElementById('dash-shell').classList.add('on');
    App.showView(State.view || 'today');
  },

  showView: function(view) {
    State.view = view;
    document.querySelectorAll('#topNav .nav-btn, #appRail .nav-btn').forEach(function(b) {
      b.classList.toggle('on', b.dataset.view === view);
    });
    var content = document.getElementById('dashContent');
    if (!content) return;
    switch (view) {
      case 'today':     content.innerHTML = Views.today();     break;
      case 'week':      content.innerHTML = Views.week();      break;
      case 'progress':  content.innerHTML = Views.progress();  break;
      case 'summaries': content.innerHTML = Views.summaries(); break;
    }
  },

  toggleMobileNav: function() {
    var mn = document.getElementById('mobileNav');
    if (mn) mn.classList.toggle('hidden');
  },

  reset: function() {
    if (!confirm('¿Reiniciar EstudIA? Se borrará todo el progreso.')) return;
    Persist.clear();
    location.reload();
  }
};

// ── Bootstrap ──────────────────────────────────
document.addEventListener('DOMContentLoaded', App.init);

// ── Minimal local tests (optional) ──────────────
// Run by opening the file with ?tests=1
(function() {
  try {
    var sp = new URLSearchParams(location.search || '');
    if (sp.get('tests') !== '1') return;

    function assert(cond, msg) { if (!cond) throw new Error(msg || 'assert failed'); }
    function eq(a, b, msg) { assert(a === b, msg || (a + ' !== ' + b)); }

    var out = [];
    function test(name, fn) {
      try { fn(); out.push({ name:name, ok:true }); }
      catch (e) { out.push({ name:name, ok:false, err: String(e && e.message ? e.message : e) }); }
    }

    test('Utils.time normaliza 8h30', function() {
      eq(Utils.time('8h30'), '08:30');
      eq(Utils.time('8.30'), '08:30');
      eq(Utils.time('8'), '08:00');
    });

    test('Parse._daysFrom soporta X y rangos', function() {
      var a = Parse._daysFrom('Futbol Ma y Ju');
      eq(a.join(','), '1,3');
      var b = Parse._daysFrom('Lunes a viernes');
      eq(b.join(','), '0,1,2,3,4');
      var c = Parse._daysFrom('L M X J V');
      eq(c.join(','), '0,1,2,3,4');
    });

    test('Parse.scheduleDetailed detecta errores por linea', function() {
      var p = Parse.scheduleDetailed('Calculo lunes de 8 a 10\nHistoria jueves');
      assert(p.items.length === 1, 'debio parsear 1');
      assert(p.errors.length >= 1, 'debio reportar error');
    });

    test('Parse.activitiesDetailed acepta sin horas pero con dias', function() {
      var p = Parse.activitiesDetailed('Trabajo viernes');
      assert(p.items.length === 1, 'debio parsear 1');
      eq(p.items[0].start, '');
    });

    test('Parse._timesFrom soporta en-dash', function() {
      var t = Parse._timesFrom('de 18:00 – 20:00');
      assert(!!t, 'debe detectar rango');
      eq(t.start, '18:00');
      eq(t.end, '20:00');
    });

    test('Analytics.overallTopics calcula porcentaje', function() {
      var savedExams = State.exams, savedPlan = State.plan;
      State.exams = [{ id:'x1', subject:'Test', topics:['Tema uno','Tema dos'] }];
      State.plan = [{ date:'2099-01-01', sessions:[{ examId:'x1', topic:'Tema uno', done:true }] }];
      var r = Analytics.overallTopics();
      eq(r.total, 2);
      eq(r.done, 1);
      eq(r.pct, 50);
      State.exams = savedExams; State.plan = savedPlan;
    });

    var failed = out.filter(function(r){ return !r.ok; });
    var body = '<div class="card"><div style="font-size:14px;font-weight:600;margin-bottom:8px;">Tests (' + (out.length - failed.length) + '/' + out.length + ')</div>' +
      out.map(function(r) {
        return '<div class="t-sm" style="padding:8px 0;border-bottom:1px solid var(--border);">' +
          '<div style="font-weight:600;color:' + (r.ok ? 'var(--green)' : 'var(--coral)') + ';">' +
          (r.ok ? 'OK' : 'FAIL') + ' &mdash; ' + Utils.esc(r.name) + '</div>' +
          (r.ok ? '' : '<div class="t-xs t-dim" style="margin-top:4px;">' + Utils.esc(r.err) + '</div>') +
        '</div>';
      }).join('') +
    '</div>';

    UI.modal('Pruebas locales', body);
  } catch(e) {
    console.warn('tests init failed', e);
  }
})();
</script>
